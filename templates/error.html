<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ошибка {{ status }} · LinguaRust</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6fa;
        --card: #fff;
        --line: #dfe3ee;
        --text: #1c2233;
        --code: #3b5bdb;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1219;
        --card: #171b26;
        --line: #2a3142;
        --text: #e7eaf3;
        --code: #7c99ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 32px;
        max-width: 460px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      .code {
        font-size: 52px;
        font-weight: 700;
        color: var(--code);
        margin: 0;
      }
      a.btn {
        display: inline-block;
        margin-top: 18px;
        background: var(--code);
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
    <script>
      try {
        var saved = localStorage.getItem("linguarust.theme");
        if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="box">
      <p class="code">{{ status }}</p>
      <p>{{ message }}</p>
      <a class="btn" href="/">На главную</a>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ошибка {{ status }} · LinguaRust</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6fa;
        color: #1c2233;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .box {
        background: #fff;
        border: 1px solid #dfe3ee;
        border-radius: 12px;
        padding: 32px;
        max-width: 460px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(20, 25, 45, 0.08);
      }
      .code {
        font-size: 52px;
        font-weight: 700;
        color: #3b5bdb;
        margin: 0;
      }
      a.btn {
        display: inline-block;
        margin-top: 18px;
        background: #3b5bdb;
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="code">{{ status }}</p>
      <p>{{ message }}</p>
      <a class="btn" href="/">На главную</a>
    </div>
  </body>
</html>

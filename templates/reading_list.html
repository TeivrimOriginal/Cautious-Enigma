{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h1>Тексты для чтения</h1>
  <p class="muted" style="margin-top: 0;">
    Нажмите на любое слово в тексте — появится перевод и кнопка «В карточки».
  </p>
</section>

<div class="grid cols-2">
  {% for text in texts %}
    <section class="panel" style="margin-bottom: 0;">
      <div class="actions" style="justify-content: space-between;">
        <h3 style="margin: 0;">{{ text.title }}</h3>
        <span class="tag">{{ text.level }}</span>
      </div>
      <p class="muted small">{{ text.summary }}</p>
      <p class="muted small">{{ text.word_count }} слов</p>
      <a class="btn small" href="/reading/{{ text.slug }}">Читать</a>
    </section>
  {% endfor %}
</div>
{% endblock %}

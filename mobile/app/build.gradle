plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linguarust.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.linguarust.mobile'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            // Учебные данные общие с серверной и веб-версиями.
            assets.srcDirs = ['src/main/assets', '../../data']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

[package]
name = "linguarust-desktop"
version = "0.2.0"
edition = "2024"
description = "Desktop shell for LinguaRust"
license = "MIT"

[dependencies]
global-hotkey = "0.8.0"
muda = "0.20.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
wry = "0.53"

[profile.release]
strip = true

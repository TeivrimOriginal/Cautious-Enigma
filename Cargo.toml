[package]
name = "linguarust"
version = "0.1.0"
edition = "2024"
description = "LinguaRust — сайт изучения английского языка: карточки с интервальным повторением SM-2, чтение с переводом по клику, грамматика и статистика"
license = "MIT"
repository = "https://github.com/TeivrimOriginal/Cautious-Enigma"
readme = "README.md"
keywords = ["axum", "sqlx", "askama", "sm2", "education"]
categories = ["education", "web-programming::http-server"]

[lib]
name = "linguarust"
path = "src/lib.rs"

# Локальный запуск: cargo run --bin linguarust
[[bin]]
name = "linguarust"
path = "src/main.rs"

# Serverless-функция для Vercel: перехватывает все маршруты (см. vercel.json)
[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
askama = { version = "0.16.1", features = ["derive"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "derive",
    "json",
    "chrono",
    "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-cookies = { version = "0.11.0", features = ["signed"] }
tower-http = { version = "0.7.1", features = ["trace", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde", "fast-rng"] }
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

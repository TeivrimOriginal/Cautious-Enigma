name: Deploy to Vercel

# Деплой запускается при пуше в main и вручную из вкладки Actions.
# Нужен один раз добавить секреты репозитория:
#   VERCEL_TOKEN  — токен Vercel (Deployment / Teams)
#   DATABASE_URL  — строка подключения к Neon
#   COOKIE_KEY    — 128 hex-символов для подписи cookie

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Задеплоить на Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: --prod
          # Передаём секреты прямо в проект Vercel при деплое.
          secrets: |
            production/DATABASE_URL@${{ secrets.DATABASE_URL }}
            production/COOKIE_KEY@${{ secrets.COOKIE_KEY }}
            production/RUST_LOG@linguarust=info,tower_http=info,warn
